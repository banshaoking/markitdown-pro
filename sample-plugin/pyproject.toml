[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markitdown-sample-plugin"
version = "0.2.0"
description = "A production-ready sample plugin for MarkItDown — demonstrates src/ layout, type hints, tests, and modern Python packaging."
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
keywords = ["markitdown", "plugin", "markdown", "converter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "markitdown>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.entry-points."markitdown.plugins"]
sample = "markitdown_sample_plugin:SamplePlugin"

[project.urls]
Homepage = "https://github.com/yourname/markitdown-sample-plugin"
Repository = "https://github.com/yourname/markitdown-sample-plugin"
Issues = "https://github.com/yourname/markitdown-sample-plugin/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/markitdown_sample_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "SIM"]
